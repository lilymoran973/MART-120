<html>
    <head>
        <title>Lily Mae Morans Self Portait</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
        <script>
            let circleX = 70;
            let circleSpeed;
            let circle2X = 430;
            let circle2speed;
            let circle3Y = 180;
            let circle3Speed;
            let circle4Y = 350;
            let circle4Speed;
            let circle5X =100;
            let circle5Y = 100;
            let circle5SpeedX;
            let circle5speedY;
            let titleSize = 20;
            let titleDirection = 1;
            let titleSteps = 0;

            function setup() {
                createCanvas(500, 600);
                circleSpeed = random(1,4);
                circle2Speed = random(2,5);
                circle3Speed = random(1,3);
                circle4Speed = random(2,4);
                circle5SpeedX = random(1,3);
                circle5SpeedY = random(2,4);
            }
            function draw() {
                background(255, 225, 235);
                
                // Portrait Title
                noStroke();
                fill(100,50,80);
                textSize(titleSize);
                text("Lily Mae Morans Self Portrait", 61, 45);

                //Make title grow and shrink
                if (frameCount % 10 === 0) {
                    titleSize = titleSize + titleDirection * 2;
                    titleSteps++;
                    if (titleSteps === 5) {
                        titleDirection = -titleDirection;
                        titleSteps = 0;
                    }
                }

                // Long black hair 
                fill(25, 20, 25);
                ellipse(250, 320, 230, 400);

                // Neck
                fill(255,220,195);
                rect(225,350,50,70);

                // Purple shirt
                fill(185, 155,215);
                rect(140,410,220,140);

                // Face
                fill(255,220,195);
                ellipse(250,270,165,210);

                // Hair on top
                fill(25,20,25);
                arc(250,205,175,130,PI, TWO_PI);

                // Long hair on sides
                ellipse(165,345,45,280);
                ellipse(335,345,45,280);

                // White part of the eyes
                fill(255);
                ellipse(215,265,32,22);
                ellipse(285,265,32,22);

                // Brown eyes
                fill(110,65,35);
                circle(215,265,17);
                circle(285,265,17);

                // Pupils
                fill(20);
                circle(215,265,8);
                circle(285,265,8);

                // Eyebrowns
                stroke(30,20,20);
                strokeWeight(3);
                line(195,240,230,240);
                line(270,240,305,240);

                // Nose using a point
                stroke(180,130,110);
                strokeWeight(5);
                point(250,295);

                // Smile
                noFill();
                stroke(180,60,90);
                strokeWeight(5);
                arc(250,325,60,35,0,PI);

                //shirt collar using triangles
                noStroke();
                fill(255);
                triangle(220,410,250,440,250,410);
                triangle(250,410,250,440,280,410);

                // circles
                fill(255);
                circle(circleX,110,25);
                circle(circle2X,125,35);

                // Move first circle left and right
                circleX = circleX + circleSpeed;

                if (circleX >487 || circleX <13){
                    circleSpeed = -circleSpeed;
                }
                //Move Second Circle left and right
                circle2X= circle2X +circle2Speed;

                if (circle2X > 482 || circle2X <18) {
                    circle2Speed = -circle2speed;
                }
                // Pink circles moving up and down
                noStroke();
                fill(255, 150, 190);

                circle(45, circle3Y, 25);
                circle(455, circle4Y, 30);

                //Move third circle up and down
                circle3Y = circle3Y + circle3Speed;

                if (circle3Y > 587 || circle3Y <18) {
                    circle3Speed = -circl3Speed;
                }
                //Move fourth circle up and down
                circle4Y = circle4Y + circle4Speed;

                if (circle4Y > 585 || circle4Y < 15) {
                    circle4Speed = -circle4Speed;
                }
                
                //circle moving diagonally
                noStroke();
                fill(200,100,200);
                circle(circle5X, circle5Y,25);

                //Move diagonally
                circle5X = circle5X + circle5SpeedX;
                circle5Y = circle5Y + circle5SpeedY;

                //Bounce left and right
                if (circle5X >487 || circle5X <13) {
                    circle5Speed = -circle5SpeedX;
                }
                //Bounce up and down
                if(circle5Y > 587 || circle5Y <13) {
                    circle5SpeedY = -circle5SpeedY;
                }

                // Signature
                fill(100,50,80);
                textSize(20);
                text("Lily Mae Moran",255,580);
                }
        </script>
    </head>
    <body>

    </body>
</html>
